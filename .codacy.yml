---
engines:
  eslint:
    enabled: false
  jacksonlinter:
    enabled: false
  remark-lint:
    enabled: true
tools:
  eslint: false
  jacksonlinter: false
exclude_paths:
  - "**/bin/**"
  - "**/obj/**"
  - "**/packages/**"
  - "**/.vs/**"
  - "**/.claude/**"
  - "**/Resources/**"
  - "**/Properties/**"
  - "**/*.resources"
  - "**/*.resx"
  - "**/*.ico"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.zip"
  - "**/*.ttf"
  - "**/App.config"
  - "**/packages.config"
  - "**/*.sln"
  - "**/*.csproj"
