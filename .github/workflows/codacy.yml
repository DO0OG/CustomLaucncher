# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '16 0 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Codacy Analysis CLI를 직접 실행합니다. 공식 action의 실행 스크립트는 컨테이너에 환경 변수를
      # 넘기지 않고, CLI의 SARIF 작성 단계가 결과에 따라 MalformedInputException으로 중단되는 결함이
      # 있어, CLI는 JSON으로만 결과를 내고 SARIF 변환은 아래 스크립트가 맡습니다. 실제 결과를 내는
      # Sonar C# 도구만 돌리며, 규칙은 저장소 루트 SonarLint.xml을 따릅니다.
      - name: Run Codacy Analysis CLI
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          docker run --rm \
            --env CODACY_CODE="$GITHUB_WORKSPACE" \
            --env CODACY_PROJECT_TOKEN="$CODACY_PROJECT_TOKEN" \
            --env JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8" \
            --env LANG=C.UTF-8 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            codacy/codacy-analysis-cli:4.0.0 -- \
            analyze --directory "$GITHUB_WORKSPACE" --tool sonarscharp \
            $([ -n "$CODACY_PROJECT_TOKEN" ] && echo "--project-token $CODACY_PROJECT_TOKEN") \
            --format json --output "$GITHUB_WORKSPACE/results.json" \
            --max-allowed-issues 2147483647

      - name: Convert results to SARIF
        run: |
          python3 - <<'PY'
          import json, os
          root = os.environ["GITHUB_WORKSPACE"]
          data = json.load(open("results.json", encoding="utf-8"))

          def unwrap(node):
              # circe는 sealed trait를 {"Issue": {...}}처럼 한 겹 감싸 내보냅니다.
              while isinstance(node, dict) and len(node) == 1 and isinstance(next(iter(node.values())), dict):
                  node = next(iter(node.values()))
              return node

          def scalar(value, key):
              return value.get(key) if isinstance(value, dict) else value

          def line_of(location):
              location = unwrap(location)
              return int(location.get("line", 1)) if isinstance(location, dict) else 1

          levels = {"Err": "error", "Warn": "warning", "Info": "note"}
          rules, results = {}, []
          for element in data:
              issue = unwrap(element)
              if not isinstance(issue, dict) or "patternId" not in issue:
                  continue  # FileError, FileMetrics 등은 건너뜁니다.
              rule_id = "SonarCSharp_" + str(scalar(issue["patternId"], "value"))
              message = str(scalar(issue.get("message", ""), "text"))
              rules.setdefault(rule_id, {"id": rule_id, "shortDescription": {"text": rule_id}})
              results.append({
                  "ruleId": rule_id,
                  "level": levels.get(issue.get("level"), "warning"),
                  "message": {"text": message},
                  "locations": [{"physicalLocation": {
                      "artifactLocation": {"uri": str(issue.get("filename", "")).replace("\\", "/"), "uriBaseId": "%SRCROOT%"},
                      "region": {"startLine": max(1, line_of(issue.get("location", {})))},
                  }}],
              })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {"name": "Sonarscharp (reported by Codacy)", "rules": list(rules.values())}},
                  "originalUriBaseIds": {"%SRCROOT%": {"uri": "file://" + root.rstrip("/") + "/"}},
                  "results": results,
              }],
          }
          json.dump(sarif, open("results.sarif", "w", encoding="utf-8"), ensure_ascii=False)
          print("results:", len(results), "rules:", len(rules))
          PY

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
