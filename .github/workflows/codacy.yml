# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '16 0 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose file encodings on runner (temporary)
        run: |
          python3 - <<'PY'
          import os
          bad=0
          for root,dirs,files in os.walk('.'):
              if '/.git' in root: continue
              for f in files:
                  p=os.path.join(root,f); b=open(p,'rb').read()
                  if b'\x00' in b[:8000]: continue
                  try: b.decode('utf-8')
                  except UnicodeDecodeError as e: bad+=1; print('NOT UTF-8:',p,e.start,b[max(0,e.start-40):e.start+4])
          print('non-utf8 files:',bad)
          PY
          locale; echo "LANG=$LANG"; git config --get core.autocrlf || true
      - name: Image java properties (temporary diagnostic)
        run: docker run --rm --entrypoint java codacy/codacy-analysis-cli:4.0.0 -XshowSettings:properties -version 2>&1 | grep -E 'encoding|java.version' || true
      - name: Codacy JSON run (temporary diagnostic)
        continue-on-error: true
        run: |
          docker run --rm \
            --env CODACY_CODE="$GITHUB_WORKSPACE" \
            --env JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            codacy/codacy-analysis-cli:4.0.0 -- \
            analyze --directory "$GITHUB_WORKSPACE" --tool sonarscharp --format json --output "$GITHUB_WORKSPACE/results.json" \
            --max-allowed-issues 2147483647 || true
          python3 - <<'PY'
          import json,os
          try: data=json.load(open('results.json',encoding='utf-8'))
          except Exception as e: print('no json:',e); raise SystemExit
          names=set()
          def walk(o):
              if isinstance(o,dict):
                  if 'filename' in o: names.add(o['filename'])
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(data)
          print('files with results:',len(names))
          for n in sorted(names): print('RESULT FILE:',n)
          for n in sorted(names):
              try: open(n,'rb').read().decode('utf-8')
              except FileNotFoundError: print('MISSING:',n)
              except UnicodeDecodeError as e: print('NOT UTF-8:',n,e.start)
          PY

      # Codacy Analysis CLI를 직접 실행합니다. 공식 action의 실행 스크립트는 컨테이너에
      # JAVA_TOOL_OPTIONS를 넘기지 않아 SARIF 작성 단계가 한국어 줄에서 MalformedInputException으로
      # 중단되므로, 같은 docker 호출에 UTF-8 설정만 더해 실행합니다.
      - name: Run Codacy Analysis CLI
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          docker run --rm \
            --env CODACY_CODE="$GITHUB_WORKSPACE" \
            --env CODACY_PROJECT_TOKEN="$CODACY_PROJECT_TOKEN" \
            --env JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8" \
            --env LANG=C.UTF-8 \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" \
            --volume /tmp:/tmp \
            codacy/codacy-analysis-cli:4.0.0 -- \
            analyze --verbose --directory "$GITHUB_WORKSPACE" \
            $([ -n "$CODACY_PROJECT_TOKEN" ] && echo "--project-token $CODACY_PROJECT_TOKEN") \
            --format sarif --output "$GITHUB_WORKSPACE/results.sarif" \
            --max-allowed-issues 2147483647 --gh-code-scanning-compat

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
